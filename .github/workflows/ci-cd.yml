name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: munch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: munch-catering-frontend-expo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: munch-catering-frontend-expo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build:web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: munch-web-build
          path: munch-catering-frontend-expo/dist
          if-no-files-found: error

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: munch_catering_backend

    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key
      PAYMENT_PROVIDER: test
      MONGO_URI: mongodb://localhost:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: munch_catering_backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    env:
      APP_ENV: production
      SECRET_KEY: ci-only-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: docker compose config

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: munch_catering_backend
          load: true
          tags: munch-catering-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: munch-catering-frontend-expo
          no-cache: true
          pull: true
          load: true
          build-args: EXPO_PUBLIC_API_URL=/api
          tags: munch-catering-frontend:ci

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Docker images
        run: |
          for image in \
            munch-catering-backend:ci \
            munch-catering-frontend:ci
          do
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --skip-version-check \
              --exit-code 1 \
              "$image"
          done

      - name: Scan repository for secrets
        run: |
          trivy fs \
            --scanners secret \
            .

  deploy:
    name: Manual EC2 deploy
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - docker
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment settings
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$AWS_REGION"
          test -n "$EC2_INSTANCE_ID"
          test -n "$SECRET_KEY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy through SSM
        env:
          APP_DIR: ${{ vars.APP_DIR || '/opt/munch-catering' }}
          APP_REPO_URL: ${{ vars.APP_REPO_URL || format('https://github.com/{0}.git', github.repository) }}
          APP_BRANCH: ${{ github.ref_name }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PASSWORD_RESET_BASE_URL: ${{ vars.PASSWORD_RESET_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MONGO_URI: ${{ vars.MONGO_URI || 'mongodb://mongo:27017' }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Munch Catering ${GITHUB_SHA}" \
            --parameters commands="[
              \"set -eu\",
              \"sudo mkdir -p $APP_DIR\",
              \"if [ ! -d $APP_DIR/.git ]; then sudo rm -rf $APP_DIR && sudo git clone --branch $APP_BRANCH $APP_REPO_URL $APP_DIR; fi\",
              \"cd $APP_DIR && sudo git fetch --all --prune\",
              \"cd $APP_DIR && sudo git checkout $APP_BRANCH\",
              \"cd $APP_DIR && sudo git pull --ff-only origin $APP_BRANCH\",
              \"sudo tee $APP_DIR/.env >/dev/null <<'ENVEOF'\",
              \"APP_ENV=dev\",
              \"WEB_PORT=8000\",
              \"MONGO_URI=$MONGO_URI\",
              \"DB_NAME=munch_catering\",
              \"SECRET_KEY=$SECRET_KEY\",
              \"ALGORITHM=HS256\",
              \"PASSWORD_RESET_BASE_URL=$PASSWORD_RESET_BASE_URL\",
              \"RESEND_API_KEY=$RESEND_API_KEY\",
              \"PAYMENT_PROVIDER=test\",
              \"ENVEOF\",
              \"cd $APP_DIR && sudo docker compose up -d --build\",
              \"cd $APP_DIR && sudo docker compose ps\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json