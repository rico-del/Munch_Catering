services:
  frontend:
    image: ${ECR_REGISTRY:-}/munch-catering-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./munch-catering-frontend-expo
      args:
        EXPO_PUBLIC_API_URL: /api
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - web
      - app
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY:-}/munch-catering-backend:${IMAGE_TAG:-latest}
    build:
      context: ./munch_catering_backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-munch_catering}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      EMAIL_FROM: ${EMAIL_FROM:-Munch <noreply@munch.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-test}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-http://localhost/api/mpesa/callback}
    volumes:
      - portfolio_images:/app/portfolio_images
    depends_on:
      - mongo
    networks:
      - app
      - data
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    command: ["mongod", "--quiet"]
    volumes:
      - mongo_data:/data/db
    networks:
      - data
    restart: unless-stopped

volumes:
  mongo_data:
  portfolio_images:

networks:
  web:
  app:
  data: